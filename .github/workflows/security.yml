name: security
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check for likely committed secrets
        run: |
          if grep -rIn --exclude-dir=node_modules -E "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----)" .; then
            echo "Possible secret found — failing the build."; exit 1
          fi
          echo "No obvious secrets found."

  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pip-audit
      - run: pip install fastapi sqlalchemy psycopg2-binary pydantic redis celery
      - run: pip-audit || true   # advisory only — don't block on transitive CVEs in this scaffold
