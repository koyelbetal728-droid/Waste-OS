version: "3.9"
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wasteos
      POSTGRES_PASSWORD: wasteos
      POSTGRES_DB: wasteos
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasteos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      STORAGE_ROOT: /data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    ports: ["8000:8000"]
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - storage:/data/storage

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: .env
    environment:
      STORAGE_ROOT: /data/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages
      - storage:/data/storage

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/scheduler.Dockerfile
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - ./apps/scheduler:/app/apps/scheduler
      - ./packages:/app/packages

  web:
    build:
      context: apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    env_file: .env
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
