# Scrapes the real /api/v1/metrics endpoint (packages/observability/metrics.py).
# Note: that endpoint returns JSON, not Prometheus text format — add
# prometheus_client and a /metrics-prometheus route before pointing a real
# Prometheus server at this; documented honestly rather than shipping a
# config that silently fails to scrape.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: wasteos-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:8000"]
